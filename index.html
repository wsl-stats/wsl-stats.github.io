<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>WSL Chest Results | Detailed Chest Log</title>

    <!-- DataTables CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css"
    />

    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <h1>🏆 WSL Chest Results</h1>

    <div class="events-section">
      <div class="events-grid">
        <div class="event-card">
          <div class="event-header" data-target="pointsBody">
            <h2>Weekly Chest Point Quota: <span id="weeklyLimit"></span></h2>
            <span class="chevron">▼</span>
            <br /><br />
            <span id="cycleInfo"></span>
          </div>
          <div id="pointsBody" class="event-body">
            <div
              style="
                background: #1f2937;
                color: #d1d5db;
                border-radius: 12px;
                padding: 15px;
              "
            >
              <div
                id="chestPoints"
                style="margin-top: 10px; overflow-y: auto; max-height: 350px"
              ></div>
            </div>
          </div>
        </div>

        <div class="event-card olimpus">
          <div class="event-header" data-target="olimpusBody">
            <h2>🏛 Olimpus</h2>
            <span class="chevron">▼</span>
          </div>
          <div id="olimpusBody" class="event-body">
            <div id="olimpusList" class="event-list"></div>
          </div>
        </div>

        <div class="event-card dark">
          <div class="event-header" data-target="darkBody">
            <h2>🌑 Dark Omens</h2>
            <span class="chevron">▼</span>
          </div>
          <div id="darkBody" class="event-body">
            <div id="darkOmensList" class="event-list"></div>
          </div>
        </div>

        <!-- <div class="archive-wrapper event-card"> -->
        <!-- <div class="event-header" data-target="archiveBody"> -->
        <!-- <h2>📦 Archive Results</h2> -->
        <!-- <span class="chevron">▼</span> -->
        <!-- </div> -->
        <!-- <div id="archiveBody" class="event-body"> -->

        <!-- </div> -->
        <!-- </div> -->
      </div>
    </div>

    <div id="TableWrap"></div>

    <div id="overlay" class="overlay hidden">
      <div class="spinner"></div>
      <div class="text">Loading data...</div>
    </div>
    <div class="container">
      <div style="text-align: center; margin-bottom: 15px">
        <input type="date" id="dateFrom" />
        <input type="date" id="dateTo" />
        <button onclick="loadByCustomRange()">Search</button>
      </div>

      <div
        id="periodAt"
        style="text-align: right; margin-bottom: 10px; color: #fbbf24"
      ></div>
      <div
        id="generatedAt"
        style="text-align: right; margin-bottom: 10px; color: #fbbf24"
      ></div>
      <table
        id="statsTable"
        class="display compact stripe hover"
        style="width: 100%"
      >
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>

    <div id="dashboard" style="margin-top: 40px"></div>

    <!-- jQuery & DataTables -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
    <script src="js/chart.js"></script>
    <script src="js/main.js"></script>

    <script src="js/dashboard_all_players.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chest Analytics</title>

<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

<style>
body {
  background:#0f172a;
  color:#e5e7eb;
  font-family:Arial;
}

table {
  width:100%;
}

td {
  vertical-align:top;
}

.good { color:#22c55e; }
.bad { color:#ef4444; }
.mid { color:#f59e0b; }

.heat-1 { background:#111827; }
.heat-2 { background:#1f2937; }
.heat-3 { background:#374151; }
.heat-4 { background:#4b5563; }
.heat-5 { background:#6b7280; }

.details {
  display:none;
  padding:10px;
  background:#020617;
}
</style>
</head>

<body>

<h2>Weekly Chest Analytics</h2>
<div id="TableWrap">Loading...</div>

<script>

// ===== НАСТРОЙКИ =====
const BASE_PATH = "Data/";
const TARGET_POINTS = 700;

// ===== ОЧКИ =====
const POINTS = {
  "Level 10": 2,
  "Level 15": 5,
  "Level 20": 10,
  "Level 25": 20,
  "Level 30": 40,
  "Level 35": 80,
  "Level 40": 150,
  "Level 45": 300
};

// ===== УТИЛЫ =====
function getWeekDates() {
  const now = new Date();
  const day = now.getDay() || 7;

  const monday = new Date(now);
  monday.setDate(now.getDate() - day + 1);

  const dates = [];

  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    dates.push(d.toISOString().slice(0,10));
  }

  return dates;
}

function getChestType(name) {
  const n = name.toLowerCase();
  if (n.includes("epic")) return "Epic";
  if (n.includes("rare")) return "Rare";
  if (n.includes("runic")) return "Runic";
  if (n.includes("mayan")) return "Mayan";
  return name.split(" ")[0];
}

function getLevel(source) {
  const match = source.match(/Level\s\d+/);
  return match ? match[0] : "Unknown";
}

// ===== ЗАГРУЗКА =====
async function loadWeek() {
  const dates = getWeekDates();
  const all = [];

  for (const d of dates) {
    const file = BASE_PATH + `chests_${d}.txt`;

    try {
      const res = await fetch(file);
      if (!res.ok) continue;

      const text = await res.text();
      all.push(...parse(text));
    } catch {}
  }

  return all;
}

// ===== ПАРСИНГ =====
function parse(text) {
  const lines = text.split("\n");
  const res = [];

  let current = {};

  lines.forEach(l => {
    if (l.includes("Chest")) {
      if (current.name) res.push(current);
      current = { name:l.trim() };
    }
    if (l.startsWith("From:")) current.player = l.replace("From:","").trim();
    if (l.startsWith("Source:")) current.source = l.replace("Source:","").trim();
  });

  if (current.name) res.push(current);
  return res;
}

// ===== АГРЕГАЦИЯ =====
function buildStats(data) {
  const players = {};

  data.forEach(x => {
    if (!players[x.player]) {
      players[x.player] = {
        player:x.player,
        total:0,
        types:{},
        raw:[]
      };
    }

    const type = getChestType(x.name);
    const lvl = getLevel(x.source);
    const pts = POINTS[lvl] || 0;

    if (!players[x.player].types[type]) {
      players[x.player].types[type] = {
        total:0,
        levels:{}
      };
    }

    if (!players[x.player].types[type].levels[lvl]) {
      players[x.player].types[type].levels[lvl] = {
        count:0,
        points:0
      };
    }

    players[x.player].types[type].levels[lvl].count++;
    players[x.player].types[type].levels[lvl].points += pts;
    players[x.player].types[type].total += pts;
    players[x.player].total += pts;

    players[x.player].raw.push(x);
  });

  return Object.values(players);
}

// ===== HEATMAP =====
function heatClass(val) {
  if (val > 2000) return "heat-5";
  if (val > 1200) return "heat-4";
  if (val > 700) return "heat-3";
  if (val > 300) return "heat-2";
  return "heat-1";
}

// ===== РЕНДЕР =====
function render(players) {

  const allTypes = [...new Set(players.flatMap(p => Object.keys(p.types)))];

  let html = `<table id="tbl"><thead><tr>
  <th>Player</th>
  ${allTypes.map(t=>`<th>${t}</th>`).join("")}
  <th>Total</th>
  </tr></thead><tbody>`;

  players.forEach((p,i) => {

    let status = "bad";
    if (p.total >= TARGET_POINTS) status = "good";
    else if (p.total > TARGET_POINTS*0.7) status = "mid";

    html += `<tr class="${heatClass(p.total)}" data-i="${i}">
      <td><b>${p.player}</b></td>`;

    allTypes.forEach(t=>{
      const type = p.types[t];
      if (!type) {
        html += `<td>-</td>`;
        return;
      }

      let cell = "";

      Object.entries(type.levels).forEach(([lvl,v])=>{
        cell += `${lvl}: ${v.count} (${v.points})<br>`;
      });

      cell += `<b>${type.total}</b>`;
      html += `<td>${cell}</td>`;
    });

    html += `<td class="${status}"><b>${p.total}</b></td>`;
    html += `</tr>`;

    // DETAILS
    html += `<tr class="details" id="d${i}">
      <td colspan="${allTypes.length+2}">
      ${p.raw.map(r=>`${r.name} | ${r.source}`).join("<br>")}
      </td></tr>`;
  });

  html += "</tbody></table>";

  document.getElementById("TableWrap").innerHTML = html;

  $('#tbl').DataTable({ paging:false });

  // DRILL DOWN
  $("#tbl tbody tr").click(function(){
    const i = $(this).data("i");
    $(`#d${i}`).toggle();
  });
}

// ===== СТАРТ =====
(async () => {
  const data = await loadWeek();
  const stats = buildStats(data);
  render(stats);
})();

</script>

</body>
</html>
